<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique de Perfumes | Catálogo Oficial</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <h1>Boutique <span>Aromas</span></h1>
                <p>Fragancias Exclusivas</p>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar perfumes, marcas...">
            </div>
        </div>
    </header>

    <main>
        <section class="catalog" id="catalogGrid">
            <!-- Los productos se cargarán aquí dinámicamente -->
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Catálogo de Productos. Todos los derechos reservados.</p>
    </footer>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
